[build-system]
requires = ["setuptools==80.9.0", "wheel==0.46.1"]
build-backend = "setuptools.build_meta"

[project]
name = "ps2ripper"
version = "0.1.1b1"
description = "Self-contained Windows PS2 disc ripper and OPL USB drive manager"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "The Tekmyster" }]
keywords = ["playstation-2", "opl", "disc-ripper", "windows", "exfat"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Win32 (MS Windows)",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Operating System :: Microsoft :: Windows :: Windows 10",
  "Operating System :: Microsoft :: Windows :: Windows 11",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Archiving :: Backup",
]
dependencies = [
  "PySide6==6.11.2",
  "pycdlib==1.20.0",
  "hexdump==3.3",
]

[project.optional-dependencies]
build = ["pyinstaller==6.22.2"]
test = [
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "hypothesis==6.165.10",
]

[project.scripts]
ps2ripper = "ps2ripper.app:main"

[project.urls]
Homepage = "https://github.com/tekmyster/ps2-opl-ripper"
Repository = "https://github.com/tekmyster/ps2-opl-ripper.git"
Issues = "https://github.com/tekmyster/ps2-opl-ripper/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
